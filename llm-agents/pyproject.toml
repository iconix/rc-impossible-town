[project]
name = "llm-agents"
version = "0.1.0"
description = "A multi-agent simulation with LLM-powered agents interacting in a virtual world."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.4.7",
    "openai>=1.61.1",
    "pydantic>=2.10.6",
    "together>=1.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.9",
]
